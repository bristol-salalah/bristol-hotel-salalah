# Rebuilds the site when the prices file changes, so hotel staff can edit
# rates.json on GitHub and see the new prices online a few minutes later.
# Can also be started by hand from the Actions tab (Run workflow).
name: Build site

on:
  push:
    branches: [main]
    paths: [rates.json, data/i18n/*.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the pages from rates.json and the translations
        run: |
          python3 tools/build.py
          python3 tools/check_html.py
          python3 tools/check_i18n.py
      - name: Commit the rebuilt pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Build: prices from rates.json [skip ci]"
            git push
          fi
